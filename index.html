<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4f4f2">
<title>Railroad Editor</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- иконки -->
<svg hidden aria-hidden="true">
  <defs>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-import" viewBox="0 0 24 24"><path d="M12 4v9M8.5 9.5 12 13l3.5-3.5M5 16v3h14v-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 13V4M8.5 7.5 12 4l3.5 3.5M5 16v3h14v-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M7.5 6.5 4 10l3.5 3.5M4 10h9.5a5.5 5.5 0 1 1 0 11H11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="M16.5 6.5 20 10l-3.5 3.5M20 10h-9.5a5.5 5.5 0 1 0 0 11H13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-zoom-in" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M11 8.5v5M8.5 11h5M16 16l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-zoom-out" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8.5 11h5M16 16l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2.12 2.12 0 0 1 3 3L8 19l-4 1z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6.5 7l1 13h9l1-13M10 11v6M14 11v6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<div id="app">

  <header id="topbar">
    <button class="icon-btn" id="btnMenu" aria-label="Диаграммы проекта"><svg class="icon"><use href="#i-menu"/></svg></button>
    <button id="topTitle" aria-label="Открыть список диаграмм">
      <span id="projTitle"></span>
      <span id="diagTitle"></span>
    </button>
    <div class="topbar-actions">
      <button class="icon-btn" id="btnNew" aria-label="Новый проект"><svg class="icon"><use href="#i-plus"/></svg></button>
      <button class="icon-btn" id="btnImport" aria-label="Импорт"><svg class="icon"><use href="#i-import"/></svg></button>
      <button class="icon-btn" id="btnExport" aria-label="Экспорт"><svg class="icon"><use href="#i-export"/></svg></button>
      <button class="icon-btn" id="btnValidate" aria-label="Проверка"><svg class="icon"><use href="#i-check"/></svg><span id="valBadge" class="val-badge" hidden></span></button>
      <button class="icon-btn" id="btnWalk" aria-label="Режим обхода"><svg class="icon"><use href="#i-play"/></svg></button>
      <button class="icon-btn" id="btnUndo" aria-label="Отменить"><svg class="icon"><use href="#i-undo"/></svg></button>
      <button class="icon-btn" id="btnRedo" aria-label="Повторить"><svg class="icon"><use href="#i-redo"/></svg></button>
    </div>
  </header>

  <div id="canvasWrap">
    <svg id="canvas" role="application" aria-label="Канвас диаграммы"></svg>

    <div id="navChip" hidden>
      <button id="btnBack"><svg class="icon"><use href="#i-back"/></svg><span id="backLabel"></span></button>
    </div>

    <div id="zoomCluster">
      <button class="icon-btn" id="btnZoomIn" aria-label="Приблизить"><svg class="icon"><use href="#i-zoom-in"/></svg></button>
      <button class="icon-btn" id="btnZoomOut" aria-label="Отдалить"><svg class="icon"><use href="#i-zoom-out"/></svg></button>
      <button class="icon-btn" id="btnZoomFit" aria-label="Вписать в экран"><svg class="icon"><use href="#i-fit"/></svg></button>
    </div>

    <div id="emptyHint" hidden></div>
  </div>

  <nav id="toolbar" aria-label="Добавление элементов">
    <button class="chip" data-kind="start">Start</button>
    <button class="chip" data-kind="end">End</button>
    <button class="chip" data-kind="terminal">Terminal</button>
    <button class="chip" data-kind="nonterminal">Nonterminal</button>
    <button class="chip" data-kind="choice">Choice</button>
    <button class="chip" data-kind="optional">Optional</button>
    <button class="chip" data-kind="repeat">Repeat</button>
    <button class="chip" data-kind="group">Group</button>
    <button class="chip" data-kind="comment">Comment</button>
    <span class="chip-sep" aria-hidden="true"></span>
    <button class="chip toggle" id="chipEdge">Связь ↗</button>
    <button class="chip toggle" id="chipMulti">Мульти</button>
    <button class="chip toggle" id="chipSnap">Сетка</button>
  </nav>

  <div id="scrim" hidden></div>

  <!-- панель диаграмм -->
  <aside id="drawer" aria-label="Диаграммы проекта">
    <div class="drawer-head">
      <button id="projNameBtn" class="proj-name" aria-label="Переименовать проект"></button>
      <button class="icon-btn" id="drawerClose" aria-label="Закрыть"><svg class="icon"><use href="#i-close"/></svg></button>
    </div>
    <div class="drawer-scroll">
      <div class="drawer-section-title">Диаграммы</div>
      <div id="diagramList"></div>
      <button id="btnAddDiagram" class="btn add-diagram">＋ Новая диаграмма</button>
      <div class="drawer-section-title">Пресеты</div>
      <div id="presetList"></div>
      <div class="drawer-section-title">Нетерминальные ссылки</div>
      <div id="refsList"></div>
    </div>
  </aside>

  <!-- панель свойств -->
  <section id="propsSheet" class="sheet" hidden>
    <div class="sheet-head">
      <button class="icon-btn sm" id="propsCollapse" aria-label="Свернуть"><svg class="icon"><use href="#i-menu"/></svg></button>
      <span id="propsTitle" class="sheet-title"></span>
      <button class="icon-btn sm" id="propsClose" aria-label="Снять выделение"><svg class="icon"><use href="#i-close"/></svg></button>
    </div>
    <div class="sheet-body" id="propsBody"></div>
  </section>

  <!-- панель обхода -->
  <section id="trvSheet" class="sheet trv" hidden>
    <div class="sheet-head">
      <span id="trvTitle" class="sheet-title"></span>
      <button class="icon-btn sm" id="btnTrvStop" aria-label="Остановить обход"><svg class="icon"><use href="#i-close"/></svg></button>
    </div>
    <div class="sheet-body" id="trvBody"></div>
  </section>

  <!-- панель проверки -->
  <section id="valSheet" class="sheet modal-sheet" hidden>
    <div class="sheet-head">
      <span id="valTitle" class="sheet-title"></span>
      <button class="icon-btn sm" id="valClose" aria-label="Закрыть"><svg class="icon"><use href="#i-close"/></svg></button>
    </div>
    <div class="sheet-body" id="valBody"></div>
  </section>

  <div id="ctxMenu" hidden></div>

  <div id="modal" hidden><div id="modalCard"></div></div>

  <div id="toast" role="status"></div>

</div>

<script src="model.js"></script>
<script src="traversal.js"></script>
<script src="validation.js"></script>
<script src="presets.js"></script>
<script src="renderer.js"></script>
<script src="interactions.js"></script>
<script src="importExport.js"></script>
<script src="app.js"></script>
</body>
</html>
